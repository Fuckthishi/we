<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sharif Store Admin</title><link rel="stylesheet" href="styles.css"><style>body{background:#111;color:#eee}.admin{max-width:1180px;margin:auto;padding:40px 20px}.admin-card{background:#1b1b1d;border:1px solid #333;padding:24px;margin:18px 0}.admin input,.admin textarea,.admin select{width:100%;padding:12px;background:#111;border:1px solid #3b3b3d;color:white;margin:6px 0 12px}.admin label{font-size:12px;color:#aaa}.admin-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.admin button{cursor:pointer}.admin-list{display:grid;gap:10px}.admin-product{display:grid;grid-template-columns:90px 1fr auto;gap:14px;align-items:center;padding:12px;border:1px solid #333}.admin-product img{width:90px;height:70px;object-fit:contain;background:#eee}.muted{color:#999}.danger{background:#5f1515!important}.status{padding:10px 0;color:#b7ff2a}.login{max-width:440px;margin:14vh auto}.hidden{display:none}@media(max-width:700px){.admin-grid{grid-template-columns:1fr}.admin-product{grid-template-columns:70px 1fr}.admin-product>div:last-child{grid-column:1/-1}}</style></head><body><div id="loginView" class="admin login"><div class="admin-card"><p class="eyebrow">SHARIF STORE</p><h1>Admin login</h1><p class="muted">Use the owner email configured for this store.</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="loginBtn" class="primary-btn full">Sign in</button><button id="signupBtn" class="primary-btn full" style="margin-top:10px;background:#333">Create owner account</button><div id="loginStatus" class="status"></div></div></div><div id="adminView" class="admin hidden"><div style="display:flex;justify-content:space-between;align-items:center"><div><p class="eyebrow">SHARIF STORE</p><h1>Catalog admin</h1></div><button id="logoutBtn" class="primary-btn">Log out</button></div><div class="admin-card"><h2>Add product</h2><div class="admin-grid"><div><label>Name</label><input id="name" placeholder="New Balance …"></div><div><label>Price USD (0 = WhatsApp price)</label><input id="price" type="number" step="0.01" value="0"></div><div><label>Category</label><select id="category"><option>Sneakers</option><option>Slippers</option></select></div><div><label>Sizes (comma separated)</label><input id="sizes" value="39,40,41,42,43,44"></div></div><label>Description</label><textarea id="description" rows="3"></textarea><label>Product photos</label><input id="images" type="file" accept="image/*" multiple><div class="admin-grid"><label><input id="featured" type="checkbox" style="width:auto"> Featured / best seller</label><label><input id="newDrop" type="checkbox" checked style="width:auto"> New drop</label></div><button id="createBtn" class="primary-btn">Create product</button><div id="status" class="status"></div></div><div class="admin-card"><h2>Products</h2><div id="productList" class="admin-list"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js"></script></body></html>
