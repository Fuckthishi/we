name: UI smoke test
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/sharif-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 0.5; done
          cat /tmp/sharif-http.log
          exit 1
      - name: Test product interactions
        run: node tests/ui-smoke.mjs
